# Configuration nginx du site vitrine Pointage.
# Remplace le server par défaut de l'image (/etc/nginx/conf.d/default.conf).

server {
    listen      9090;
    listen      [::]:9090;
    server_name pointage.marchepro.ma _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # Redirections relatives : derrière le proxy TLS de l’hôte, un Location
    # absolu serait reconstruit en http:// et ferait retomber le visiteur en
    # clair. Le navigateur résout lui-même /mobile sur le bon schéma.
    absolute_redirect off;

    # Taille max d'un corps de requête : le site ne reçoit aucun upload.
    client_max_body_size 1m;

    # En-têtes de sécurité.
    # `always` pour qu'ils soient aussi posés sur les réponses d'erreur.
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # CSP : 'self' partout, plus Google Fonts (feuille + fichiers de police) et
    # les deux services de formulaire supportés par config.js. Pas de
    # script-src 'unsafe-inline' : le seul <script> en ligne de la page est du
    # JSON-LD, qui n'est pas exécuté et n'est donc pas soumis à la CSP.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://formsubmit.co https://api.web3forms.com https://formspree.io; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_comp_level 6;
    # Volontairement sans mp4/png : ces formats sont déjà compressés, les
    # gziper coûte du CPU pour rien et casse les requêtes par plage d'octets.
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/xml+rss;

    # --- Adresses -----------------------------------------------------------
    # Le site tient en deux pages, servies sans extension : /mobile et
    # /pointeuse. La racine n’est pas une page, elle renvoie sur /mobile.
    # .htaccess reproduit ces règles pour un hébergement Apache : les deux
    # fichiers doivent rester cohérents.
    #
    # Ces blocs sont placés avant ceux du cache : nginx retient la première
    # expression régulière qui correspond, dans l’ordre du fichier.
    location = /           { return 301 /mobile; }
    location = /index.html { return 301 /mobile; }

    # Le site a un temps servi la page pointeuses sous ce nom : les liens
    # déjà partagés doivent continuer à tomber sur la bonne page.
    location ~ "^/pointeuses(\.html)?/?$" { return 301 /pointeuse; }

    # Toute autre adresse en .html, ou avec une barre finale, est ramenée à
    # sa forme canonique. /assets/ est écarté : c’est un vrai dossier.
    location ~ "^/(.+)\.html$"       { return 301 /$1; }
    location ~ "^/(?!assets/)(.+)/$" { return 301 /$1; }

    # --- Politique de cache -------------------------------------------------
    # Les noms de fichiers ne portent pas d'empreinte : un cache long sur le
    # HTML empêcherait toute mise à jour d'être vue. On utilise `expires` et
    # non `add_header`, sinon les en-têtes de sécurité ci-dessus seraient
    # perdus dans ces blocs (nginx n'hérite pas des add_header parents dès
    # qu'un bloc en déclare un).

    # CSS et JS : une journée.
    location ~* \.(?:css|js)$ {
        expires 1d;
    }

    # Images, vidéo, polices : un mois.
    # nginx gère nativement les requêtes Range, indispensable pour que la
    # vidéo de démo se lise en streaming et soit navigable à la souris.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|mp4|webm|woff2?)$ {
        expires 30d;
    }

    # HTML et tout le reste : revalidé à chaque visite.
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # Sonde de santé pour Docker / le reverse proxy.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return       200 "ok\n";
    }

    location = /robots.txt  { expires 1d; access_log off; }
    location = /favicon.ico { expires 30d; access_log off; log_not_found off; }
}
