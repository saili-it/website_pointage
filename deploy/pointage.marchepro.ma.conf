# Vhost nginx à installer SUR L'HÔTE (pas dans le conteneur).
#
#   sudo cp deploy/pointage.marchepro.ma.conf /etc/nginx/sites-available/pointage
#   sudo ln -s /etc/nginx/sites-available/pointage /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pointage.marchepro.ma
#
# Certbot ajoutera lui-même le bloc `listen 443 ssl`, les chemins des
# certificats et la redirection HTTP -> HTTPS. Ne les écrivez pas à la main :
# il a besoin de trouver ce fichier dans son état d'origine pour le modifier.
#
# Ne dupliquez pas ici les en-têtes de sécurité ni les règles de cache : ils
# sont déjà posés par le nginx du conteneur et traversent le proxy tels quels.

server {
    listen      80;
    listen      [::]:80;
    server_name pointage.marchepro.ma;

    # Journaux séparés des autres sites de la machine.
    access_log /var/log/nginx/pointage.access.log;
    error_log  /var/log/nginx/pointage.error.log;

    location / {
        proxy_pass http://127.0.0.1:9090;

        # HTTP/1.1 est nécessaire pour le keep-alive et les requêtes par
        # plage : sans ça, la vidéo de démo ne serait plus navigable.
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Le site est statique : rien à mettre en tampon côté proxy, on laisse
        # nginx du conteneur streamer directement.
        proxy_buffering off;
    }
}
